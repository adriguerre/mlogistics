services:

  # ─── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: mlogistics-db
    environment:
      # ⚠️ Fake credentials for development/testing only (docker build) — override with real env vars in production
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mlogisticsdb
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init/military_logistics_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docker/init/sample_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d mlogisticsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Spring Boot app ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: mlogistics-app
    ports:
      - "8080:8080"
    environment:
      # ⚠️ Fake credentials for development/testing only (docker build) — override with real env vars in production
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mlogisticsdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: docker
      JWT_KEY: ${JWT_KEY:-fakeCredential}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ─── Kafka (KRaft) ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.9.6
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 9092 → internal Docker traffic (kafka:9092)
      # 29092 → external host traffic (localhost:29092)
      # 9093 → controller (KRaft)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # JMX (Datadog metrics)
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_OPTS: >-
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9999
        -Dcom.sun.management.jmxremote.rmi.port=9999
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=kafka
    volumes:
      - kafka_kraft:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z kafka 9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Datadog Agent ─────────────────────────────────────────────
  datadog:
    build:
      context: .
      dockerfile: Dockerfile
      target: datadog
    container_name: datadog
    environment:
      DD_API_KEY: ${DATADOG_API_KEY}
      DD_SITE: datadoghq.eu
      DD_JMX_USE_CONTAINER_SUPPORT: "false"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./datadog/conf.d:/etc/datadog-agent/conf.d
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pg_data:
  kafka_kraft:
